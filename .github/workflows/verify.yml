name: Verify pipeline

# Runs fetch_metrics.py and build_site.py end-to-end on every PR to main, without
# committing or deploying anything, so a broken script or workflow change fails CI
# before merge instead of surfacing in production. No path filter -- verify is a
# required status check, and a path-filtered trigger left docs-only PRs permanently
# blocked (never matched, so the check never ran). See BOOTSTRAP.md for the branch
# protection config that enforces the required check.
# **NOTE:** This does run on PRs from forks, but repo secrets (SIRIUS_TRAFFIC_TOKEN)
# aren't exposed to them, so a fork PR only gets partial coverage (no traffic
# collection -- see the Fetch metrics step below). Push branches to origin directly,
# not a fork, to get full verification coverage before merging.

on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      # SIRIUS_TRAFFIC_TOKEN is unavailable on PRs from forks -- fetch_metrics.py
      # already handles that by skipping traffic collection gracefully, so this
      # still verifies the rest of the pipeline (repo stats, activity, releases).
      - name: Fetch metrics (not committed)
        env:
          SIRIUS_TRAFFIC_TOKEN: ${{ secrets.SIRIUS_TRAFFIC_TOKEN }}
        run: uv run scripts/fetch_metrics.py

      - name: Build site
        run: uv run scripts/build_site.py

      # Same fork-token caveat as Fetch metrics above -- exits cleanly without a
      # token, still verifies the script itself runs.
      - name: Refresh traffic (not committed)
        env:
          SIRIUS_TRAFFIC_TOKEN: ${{ secrets.SIRIUS_TRAFFIC_TOKEN }}
        run: uv run scripts/refresh_traffic.py
