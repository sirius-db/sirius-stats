name: Collect metrics

# Runs fetch_metrics.py once per UTC day to snapshot sirius-db/sirius's stars, forks,
# traffic, and issue/PR/commit activity, then commits the result to data/snapshots/.
# This is the only source of truth for anything GitHub doesn't retain long-term
# (traffic data is dropped after 14 days) -- see README.md and BOOTSTRAP.md for the
# full picture.

on:
  schedule:
    # Fires every 30 min across a window (2300-0159 UTC) instead of once at a fixed
    # time -- GitHub Actions scheduled runs have no timing guarantee and can be
    # delayed or dropped under load (see docs.github.com/actions, "schedule" event).
    # The "Gate" step below turns most of these into a no-op; only the first firing
    # in the window that finds no snapshot for the current UTC day actually collects.
    # Window starts at 2300 (not earlier) so the common case -- first firing succeeds
    # right away -- still lands close to day-end, same as the old fixed 2330 schedule;
    # it only extends *later*, past midnight, to catch the kind of multi-hour delay
    # that GitHub's scheduler can introduce under load.
    - cron: "*/30 23 * * *"
    - cron: "*/30 0-1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # Prevents a manual workflow_dispatch run from racing the scheduled run's git push --
  # queues instead of canceling, so a manual run never causes a scheduled snapshot to
  # be silently dropped.
  group: collect-metrics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Bounds how long a hung run (e.g. stuck on a GitHub API rate-limit backoff) can
    # occupy the queue -- cancel-in-progress: false means every later firing in the
    # window waits behind it, so an unbounded run could silently eat the whole window.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # Default GITHUB_TOKEN can't push once main requires a PR -- this PAT's
          # owner is a repo admin, and enforce_admins is off, so the push bypasses
          # the PR requirement. See BOOTSTRAP.md.
          token: ${{ secrets.COLLECT_PUSH_TOKEN }}

      - name: Gate
        id: gate
        # workflow_dispatch always runs, targeting today (no --date, same as before).
        # A schedule-triggered run's target date depends on which cron entry fired:
        # the 2300 entry is still filling in *today* (the day about to end); the
        # 0000-0159 entries exist only to catch a run from the 2300 entry that got
        # delayed past midnight, so they target *yesterday*, not the new "today" --
        # otherwise a run that crosses midnight would silently orphan the day it was
        # meant to cover and instead write a near-empty snapshot for the new day (the
        # exact bug this workflow exists to prevent, just moved one step over). Only
        # proceeds if that target date's snapshot doesn't already exist.
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "target=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$SCHEDULE" = "*/30 23 * * *" ]; then
            target="$(date -u +%Y-%m-%d)"
          else
            target="$(date -u -d yesterday +%Y-%m-%d)"
          fi
          if [ -f "data/snapshots/${target}.json" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "data/snapshots/${target}.json already exists, skipping"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "target=${target}" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v10.0.1
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Fetch metrics
        if: steps.gate.outputs.run == 'true'
        env:
          SIRIUS_TRAFFIC_TOKEN: ${{ secrets.SIRIUS_TRAFFIC_TOKEN }}
          TARGET_DATE: ${{ steps.gate.outputs.target }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            uv run scripts/fetch_metrics.py --date "$TARGET_DATE"
          else
            uv run scripts/fetch_metrics.py
          fi

      - name: Commit snapshot
        if: steps.gate.outputs.run == 'true'
        env:
          TARGET_DATE: ${{ steps.gate.outputs.target }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "chore: add snapshot for ${TARGET_DATE:-$(date -u +%Y-%m-%d)}"
          git push
